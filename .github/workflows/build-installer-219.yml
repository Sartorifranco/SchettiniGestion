name: Build SCHPOS Setup 2.1.9

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/modificaciones-sch-pos-1972
    paths:
      - 'SchettiniGestion/**'
      - 'SchettiniGestion.WPF/**'
      - 'Instalador/**'
      - '.github/workflows/build-installer-219.yml'

permissions:
  contents: read
  actions: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore SchettiniGestion.sln

      - name: Ensure Inno Setup (ISCC)
        shell: powershell
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup no encontrado; instalando con Chocolatey..."
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe no encontrado" }
          Write-Host "ISCC: $iscc"
          & $iscc /? | Select-Object -First 3

      - name: Build Release + Setup 2.1.9
        shell: powershell
        run: |
          .\Instalador\build-release.ps1 -Configuration Release -Platform "Any CPU" -BuildInstaller

      - name: Listar salida
        shell: powershell
        run: |
          Get-ChildItem Instalador\Output -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime
          if (-not (Test-Path "Instalador\Output\SCHPOS-Setup-2.1.9.exe")) {
            throw "No se genero SCHPOS-Setup-2.1.9.exe"
          }

      - name: Subir instalador (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SCHPOS-Setup-2.1.9
          path: Instalador/Output/SCHPOS-Setup-2.1.9.exe
          if-no-files-found: error
          retention-days: 14
