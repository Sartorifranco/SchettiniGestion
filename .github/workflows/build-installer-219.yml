name: Build SCHPOS Setup 2.1.9

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/modificaciones-sch-pos-1972
    paths:
      - 'SchettiniGestion/**'
      - 'SchettiniGestion.WPF/**'
      - 'Instalador/**'
      - '.github/workflows/build-installer-219.yml'

permissions:
  contents: read
  actions: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore SchettiniGestion.sln

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup --version=6.3.3 -y --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            throw "ISCC.exe no encontrado tras instalar Inno Setup"
          }

      - name: Build Release + Setup 2.1.9
        shell: powershell
        run: |
          .\Instalador\build-release.ps1 -Configuration Release -Platform "Any CPU" -BuildInstaller

      - name: Listar salida
        shell: powershell
        run: |
          Get-ChildItem Instalador\Output -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime
          if (-not (Test-Path "Instalador\Output\SCHPOS-Setup-2.1.9.exe")) {
            throw "No se genero SCHPOS-Setup-2.1.9.exe"
          }

      - name: Subir instalador (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SCHPOS-Setup-2.1.9
          path: Instalador/Output/SCHPOS-Setup-2.1.9.exe
          if-no-files-found: error
          retention-days: 14
